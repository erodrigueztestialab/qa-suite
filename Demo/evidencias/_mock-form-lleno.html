<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Portal Corporativo Aurora - Iniciar sesión</title>
<style>
  * { box-sizing: border-box; margin:0; padding:0; font-family: 'Segoe UI', Arial, sans-serif; }
  body { background:#0b3d63; min-height:100vh; display:flex; align-items:flex-start; justify-content:center; padding-top:60px; }
  .card {
    width:420px; background:#fff; border-radius:10px; padding:28px 30px; box-shadow:0 8px 24px rgba(0,0,0,.25);
  }
  .brand { font-weight:700; font-size:14px; color:#0b3d63; letter-spacing:.3px; margin-bottom:14px; }
  h1 { font-size:18px; color:#14263b; margin-bottom:18px; }
  label { display:block; font-size:12px; color:#5b6b7d; margin-bottom:4px; font-weight:600; }
  .field { margin-bottom:14px; }
  input {
    width:100%; padding:9px 11px; border:1px solid #cdd7e1; border-radius:6px; font-size:14px; color:#14263b;
  }
  input:focus, input.filled { border-color:#2f8fd6; }
  .btn {
    width:100%; padding:10px; background:#0b3d63; color:#fff; border:none; border-radius:6px;
    font-size:14px; font-weight:700; margin-top:6px; cursor:pointer;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">PORTAL CORPORATIVO AURORA</div>
    <h1>Iniciar sesión</h1>
    <div class="field">
      <label>Correo corporativo</label>
      <input class="filled" type="text" value="usuario.valido@aurora.com">
    </div>
    <div class="field">
      <label>Contraseña</label>
      <input class="filled" type="password" value="Correcta123*">
    </div>
    <button class="btn">Iniciar sesión</button>
  </div>
</body>
</html>
